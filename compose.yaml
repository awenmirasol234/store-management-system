services:
  caddy:
    image: ghcr.io/awenmirasol234/store-management-system-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - caddy_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "--header=Host: store.home.arpa", "https://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/awenmirasol234/store-management-system-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      DATABASE_PATH: /data/store.db
      UPLOADS_DIR: /data/uploads
    volumes:
      - store_data:/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  store_data:
