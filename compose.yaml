services:
  frontend:
    container_name: store-management-system-frontend
    image: ghcr.io/awenmirasol234/store-management-system-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    container_name: store-management-system-backend
    image: ghcr.io/awenmirasol234/store-management-system-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      DATABASE_PATH: /data/store.db
      UPLOADS_DIR: /data/uploads
    volumes:
      - store_data:/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  store_data:
